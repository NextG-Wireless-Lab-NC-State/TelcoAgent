# TelcoAgent - Docker Compose
# Usage: docker compose up -d
#
# Services:
#   - neo4j : optional KG store for GraphRAG queries in the explanation
#             pipeline (the default runtime uses the in-memory ontology
#             store and needs no services at all).
#
# Secrets are sourced from .env; the ${VAR:?msg} pattern hard-fails
# compose if a variable is unset.

services:
  # --- Neo4j (KG primary store) ---
  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/init:/var/lib/neo4j/import/init:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
